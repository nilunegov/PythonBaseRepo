[project]
name = "project"
version = "0.1.0"
description = "A simple project"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.8.0",
]

# [project.scripts]
# main = "project1.main:main"

# [build-system]
# requires = ["setuptools>=68"]
# build-backend = "setuptools.build_meta"

# =========================
# Type checking
# =========================
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true