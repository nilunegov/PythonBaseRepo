[project]
name = "PythonBase"
requires-python = ">=3.13"
dynamic = ["version"]

dependencies = ["requests>=2.31.0", "python-dotenv>=1.0.0"]

[project.scripts]
run-bot = "project.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[dependency-groups]
dev = ["ruff>=0.6.0", "ty>=0.0.70"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
